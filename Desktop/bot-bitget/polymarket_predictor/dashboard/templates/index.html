<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PolyiClaude Dashboard</title>
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --green: #3fb950;
    --red: #f85149; --blue: #58a6ff; --purple: #bc8cff;
    --yellow: #d29922;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; }
  .header { background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 18px; font-weight: 600; }
  .header h1 span { color: var(--blue); }
  .badge { background: var(--green); color: #000; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 12px; }
  .badge.scanning { background: var(--yellow); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
  .stat-label { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  .stat-value { font-size: 24px; font-weight: 700; }
  .stat-value.green { color: var(--green); }
  .stat-value.red { color: var(--red); }
  .stat-value.blue { color: var(--blue); }
  .section { background: var(--card); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 24px; overflow: hidden; }
  .section-header { padding: 12px 16px; border-bottom: 1px solid var(--border); font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
  table { width: 100%; border-collapse: collapse; }
  th { padding: 10px 16px; text-align: left; color: var(--muted); font-size: 12px; font-weight: 500; border-bottom: 1px solid var(--border); }
  td { padding: 10px 16px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,0.02); }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .tag.yes { background: rgba(63,185,80,0.15); color: var(--green); }
  .tag.no  { background: rgba(248,81,73,0.15);  color: var(--red);   }
  .pnl.pos { color: var(--green); font-weight: 600; }
  .pnl.neg { color: var(--red);   font-weight: 600; }
  .btn { background: var(--blue); color: #000; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
  .btn:hover { opacity: 0.85; }
  .btn.danger { background: var(--red); color: #fff; }
  .btn.small { padding: 3px 10px; font-size: 11px; }
  .empty { padding: 40px; text-align: center; color: var(--muted); }
  .last-update { color: var(--muted); font-size: 12px; }
  .opp-edge { color: var(--purple); font-weight: 700; }
  .opp-conf { color: var(--blue); }
  .progress { height: 4px; background: var(--border); border-radius: 2px; margin-top: 4px; }
  .progress-bar { height: 100%; border-radius: 2px; background: var(--green); }
  @media (max-width: 600px) { .container { padding: 12px; } .stats-grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>

<div class="header">
  <h1>🎯 Poly<span>iClaude</span></h1>
  <div style="display:flex;gap:12px;align-items:center">
    <span class="last-update" id="lastUpdate">Cargando...</span>
    <span class="badge" id="statusBadge">LIVE</span>
    <button class="btn" onclick="forceScan()">⚡ Escanear ahora</button>
  </div>
</div>

<div class="container">

  <!-- Stats -->
  <div class="stats-grid" id="statsGrid">
    <div class="stat-card"><div class="stat-label">Posiciones abiertas</div><div class="stat-value blue" id="statPositions">—</div></div>
    <div class="stat-card"><div class="stat-label">P&L Total</div><div class="stat-value" id="statPnl">—</div></div>
    <div class="stat-card"><div class="stat-label">Win Rate</div><div class="stat-value green" id="statWin">—</div></div>
    <div class="stat-card"><div class="stat-label">Mercados rastreados</div><div class="stat-value blue" id="statTracked">—</div></div>
    <div class="stat-card"><div class="stat-label">Escaneos realizados</div><div class="stat-value" id="statScans">—</div></div>
    <div class="stat-card"><div class="stat-label">Último escaneo</div><div class="stat-value" style="font-size:14px" id="statLastScan">—</div></div>
  </div>

  <!-- Posiciones -->
  <div class="section">
    <div class="section-header">
      📊 Mis posiciones
      <span id="totalPnlBadge" style="font-size:13px"></span>
    </div>
    <div id="positionsContainer">
      <div class="empty">Cargando posiciones...</div>
    </div>
  </div>

  <!-- Oportunidades -->
  <div class="section">
    <div class="section-header">
      🔍 Últimas oportunidades detectadas
    </div>
    <div id="opportunitiesContainer">
      <div class="empty">Cargando oportunidades...</div>
    </div>
  </div>

</div>

<script>
async function fetchJSON(url) {
  const r = await fetch(url);
  return r.json();
}

function fmtPct(v) { return (v >= 0 ? '+' : '') + v.toFixed(1) + '%'; }
function fmtUSD(v) { return (v >= 0 ? '+' : '') + '$' + Math.abs(v).toFixed(2); }

async function loadStats() {
  const s = await fetchJSON('/api/stats');
  document.getElementById('statPositions').textContent = s.positions_open;
  const pnlEl = document.getElementById('statPnl');
  pnlEl.textContent = fmtUSD(s.total_pnl);
  pnlEl.className = 'stat-value ' + (s.total_pnl >= 0 ? 'green' : 'red');
  document.getElementById('statWin').textContent = s.win_rate + '%';
  document.getElementById('statTracked').textContent = s.markets_tracked.toLocaleString();
  document.getElementById('statScans').textContent = s.scan_count;
  if (s.last_scan) {
    const d = new Date(s.last_scan);
    document.getElementById('statLastScan').textContent = d.toLocaleTimeString('es-ES');
  }
  const badge = document.getElementById('statusBadge');
  badge.textContent = s.is_scanning ? 'SCANNING' : 'LIVE';
  badge.className = 'badge' + (s.is_scanning ? ' scanning' : '');
}

async function loadPositions() {
  const data = await fetchJSON('/api/positions');
  const el = document.getElementById('positionsContainer');
  const badge = document.getElementById('totalPnlBadge');

  const sign = data.total_pnl >= 0 ? '+' : '';
  badge.innerHTML = `<span style="color:${data.total_pnl>=0?'#3fb950':'#f85149'}">${sign}$${data.total_pnl.toFixed(2)} (${sign}${data.total_pnl_pct.toFixed(1)}%)</span>  |  Invertido: $${data.total_invested.toFixed(2)}`;

  if (!data.positions.length) {
    el.innerHTML = '<div class="empty">Sin posiciones. Usa /add en Telegram para registrar una apuesta.</div>';
    return;
  }

  let rows = data.positions.map(p => {
    const cls = p.pnl_usd >= 0 ? 'pos' : 'neg';
    const bar = Math.min(100, Math.abs(p.pct));
    const barColor = p.pnl_usd >= 0 ? '#3fb950' : '#f85149';
    return `<tr>
      <td style="max-width:300px">
        <div style="font-size:13px">${p.question}</div>
        <div style="color:#8b949e;font-size:11px;margin-top:2px">${p.id}</div>
      </td>
      <td><span class="tag ${p.action.toLowerCase()}">${p.action}</span></td>
      <td>${p.entry}%</td>
      <td>${p.current}%</td>
      <td>$${p.amount.toFixed(2)}</td>
      <td class="pnl ${cls}">
        ${fmtUSD(p.pnl_usd)} <span style="font-size:11px">(${fmtPct(p.pct)})</span>
        <div class="progress"><div class="progress-bar" style="width:${bar}%;background:${barColor}"></div></div>
      </td>
      <td>${p.days_ago}d</td>
      <td><button class="btn danger small" onclick="removePosition('${p.full_id}')">✕</button></td>
    </tr>`;
  }).join('');

  el.innerHTML = `<table>
    <thead><tr><th>Mercado</th><th>Acción</th><th>Entrada</th><th>Ahora</th><th>Invertido</th><th>P&L</th><th>Días</th><th></th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

async function loadOpportunities() {
  const data = await fetchJSON('/api/opportunities');
  const el = document.getElementById('opportunitiesContainer');
  document.getElementById('lastUpdate').textContent = `Último scan: ${data.last_scan ? new Date(data.last_scan).toLocaleTimeString('es-ES') : '—'}`;

  if (!data.opportunities.length) {
    el.innerHTML = '<div class="empty">Sin oportunidades recientes. El bot escanea cada 15 min.</div>';
    return;
  }

  let rows = data.opportunities.map((o, i) => {
    const edge = (o.edge * 100).toFixed(1);
    const stars = '⭐'.repeat(Math.min(5, Math.max(1, Math.floor(Math.abs(o.edge) * 20))));
    return `<tr>
      <td style="color:#8b949e;font-size:12px">#${i+1}</td>
      <td style="max-width:350px"><div style="font-size:13px">${o.question}</div></td>
      <td>${(o.market_price*100).toFixed(0)}%</td>
      <td>${(o.probability*100).toFixed(0)}%</td>
      <td class="opp-edge">${edge > 0 ? '+' : ''}${edge}%</td>
      <td class="opp-conf">${(o.confidence*100).toFixed(0)}%</td>
      <td>${stars}</td>
      <td><span class="tag ${o.action.includes('YES')?'yes':'no'}">${o.action.split(' ')[1] || o.action}</span></td>
      <td style="color:#8b949e;font-size:11px">${o.closes_in || '—'}</td>
    </tr>`;
  }).join('');

  el.innerHTML = `<table>
    <thead><tr><th>#</th><th>Mercado</th><th>Precio</th><th>Estimación</th><th>Edge</th><th>Conf.</th><th>Rating</th><th>Acción</th><th>Cierra</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

async function removePosition(id) {
  if (!confirm('¿Eliminar esta posición?')) return;
  await fetch('/api/remove_position', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({condition_id: id})});
  loadPositions();
}

async function forceScan() {
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = '⏳ Escaneando...';
  await fetch('/api/scan', {method:'POST'});
  setTimeout(() => { btn.disabled = false; btn.textContent = '⚡ Escanear ahora'; loadAll(); }, 5000);
}

async function loadAll() {
  await Promise.all([loadStats(), loadPositions(), loadOpportunities()]);
}

loadAll();
setInterval(loadAll, 30000);  // refresca cada 30s
</script>
</body>
</html>
